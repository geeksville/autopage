[project]
name = "stream-autopage"
version = "0.2.2"
description = "Automatic StreamController page definitions from TOML configs"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "Kevin Hester", email = "kevinh@geeksville.com" }]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["streamdeck", "streamcontroller", "automation", "toml"]

dependencies = [
    "tomlkit>=0.13",
    "dasbus (>=1.7,<2.0)",
    "PyGObject>=3.42,<3.52",
    "toml-repo >=0.1.4",
    "webcolors (>=25.10.0,<26.0.0)",
    "python-material-icons (>=0.3.2,<0.4.0)",
    "touchy-pad (>=0.3.3,<0.4.0)",
]

[project.urls]
Homepage = "https://github.com/geeksville/autopage"
Repository = "https://github.com/geeksville/autopage"

[project.scripts]
autopage = "autopage.cli:main"
streamclient = "autopage.sc_api_client:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "autopage", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=4.0"
ruff = ">=0.4"


[tool.poetry.dependencies]
# During development, resolve touchy-pad from the local submodule. Switch to the
# published PyPI release by removing this override.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
